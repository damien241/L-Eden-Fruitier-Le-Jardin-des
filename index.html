const CAT_LABELS = { Fruitier:"Arbre fruitier", Rente:"Culture de rente", Patrimoine:"Arbre patrimonial" };
const MONTHLY_GROWTH = 1.10;
const MS_DAY = 86400000;
const MS_MONTH = 30 * MS_DAY;
const STORAGE_KEY = "eden_fruitier_pro_v1";

/* ============================================================
   📈 MOTEUR DE REVENUS (+10 % / mois)
   ============================================================ */
function dailyIncomeAtMonth(baseDaily, monthsElapsed) {
  return baseDaily * Math.pow(MONTHLY_GROWTH, monthsElapsed);
}
function computeEarnings(holding, now = Date.now()) {
  const tree = TREES.find(t => t.id === holding.treeId);
  if (!tree) return { totalEarned: 0, currentDaily: 0, monthsElapsed: 0 };
  const startMs = holding.date;
  const lastClaimMs = holding.lastClaimAt || startMs;
  if (!startMs) return { totalEarned: 0, currentDaily: tree.dailyIncome, monthsElapsed: 0 };
  const qty = holding.qty || 1;
  let total = 0, cursor = lastClaimMs;
  while (cursor < now) {
    const monthsElapsed = Math.floor((cursor - startMs) / MS_MONTH);
    const dailyRate = dailyIncomeAtMonth(tree.dailyIncome, monthsElapsed) * qty;
    const nextMonthBoundary = startMs + (monthsElapsed + 1) * MS_MONTH;
    const segmentEnd = Math.min(now, nextMonthBoundary);
    const days = (segmentEnd - cursor) / MS_DAY;
    total += dailyRate * days;
    cursor = segmentEnd;
  }
  const monthsNow = Math.floor((now - startMs) / MS_MONTH);
  const currentDaily = dailyIncomeAtMonth(tree.dailyIncome, monthsNow) * qty;
  return { totalEarned: Math.floor(total), currentDaily: Math.round(currentDaily), monthsElapsed: monthsNow };
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  return (await Notification.requestPermission()) === "granted";
}

  if (Notification.permission !== "granted") return;

}

/* ============================================================
   🧮 STATS
   ============================================================ */
function computePortfolioStats(holdings) {
  let totalTrees=0, totalInvested=0, totalSurface=0, currentDaily=0, unclaimed=0;
  for (const h of (holdings||[])) {
    const t = TREES.find(x => x.id === h.treeId);
    if (!t) continue;
    const e = computeEarnings(h);
    totalTrees += h.qty;
    totalInvested += h.qty * t.price;
    totalSurface += h.qty * t.surface;
    currentDaily += e.currentDaily;
    unclaimed += e.totalEarned;
  }
  return { totalTrees, totalInvested, totalSurface, currentDaily, unclaimed };
}

          ${isDeposit
            ? "Choisissez votre moyen de paiement et le montant à déposer."
            : `Choisissez votre moyen de retrait. Solde : <strong>${fcfa(user?.balance || 0)}</strong>.`}
        </p>

        <label>Montant (FCFA)</label>
        <input id="modalAmount" type="number" min="1000" step="500"
               placeholder="Ex : 50000" value="${isDeposit ? '50000' : ''}">

        <label>Moyen ${isDeposit ? "de paiement" : "de retrait"}</label>
        <div class="pay-methods" id="payMethodsList">
          ${PAYMENT_METHODS.map(m => `
            <div class="pay-method" data-method="${m.id}">
              <span class="ico" style="color:${m.color};">${m.ico}</span>
              <div class="name">${m.name}</div>
              <div class="sub">${m.sub}</div>
            </div>
          `).join("")}
        </div>

        <div id="methodFields"></div>

        <button class="primary" id="modalSubmit" style="margin-top:1rem;">
          ${isDeposit ? "Procéder au dépôt" : "Confirmer le retrait"}
        </button>

        <p class="muted" style="margin-top:.9rem;font-size:.78rem;text-align:center;">
          🔒 Mode démonstration — aucune transaction réelle n'est effectuée.
        </p>
      </div>
    </div>
  `;

  document.querySelectorAll("[data-method]").forEach(el => {
    el.onclick = () => { state.modal.methodId = el.dataset.method; render(); };
  });

  if (state.modal.methodId) {
    const sel = document.querySelector(`[data-method="${state.modal.methodId}"]`);
    if (sel) sel.classList.add("selected");
    renderMethodFields();
  }
  attachModalEvents();
}

function renderMethodFields() {
  const mId = state.modal.methodId;
  if (!mId) return;
  const method = PAYMENT_METHODS.find(m => m.id === mId);
  const target = $("#methodFields");
  if (!method || !target) return;
  const labels = {
    phone:"Numéro de téléphone", email:"Adresse email PayPal",
    cardNumber:"Numéro de carte (16 chiffres)", expiry:"Date d'expiration (MM/AA)",
    cvv:"Code CVV", cardName:"Nom du titulaire",
    iban:"IBAN / RIB", bankName:"Nom de la banque", accountName:"Titulaire du compte"
  };
  const placeholders = {
    phone:"+227 90 00 00 00", email:"vous@exemple.com",
    cardNumber:"4242 4242 4242 4242", expiry:"12/27", cvv:"123",
    cardName:"JEAN DUPONT", iban:"NE00 0000 0000 0000 0000",
    bankName:"Banque Atlantique", accountName:"Jean Dupont"
  };
  target.innerHTML = `
    <div style="border-top:1px solid var(--bordure);padding-top:1rem;margin-top:.5rem;">
      <p class="muted" style="margin-bottom:.6rem;font-weight:bold;color:var(--vert-fonce);">
        ${method.ico} Informations ${method.name}
      </p>
      ${method.fields.map(f => `
        <label>${labels[f] || f}</label>
        <input type="text" id="field-${f}" placeholder="${placeholders[f] || ''}">
      `).join("")}
    </div>
  `;
}

function attachModalEvents() {
  const close = $("#modalClose");
  if (close) close.onclick = () => { state.modal = null; render(); };
  const overlay = $("#modalOverlay");
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) { state.modal = null; render(); } };
  const submit = $("#modalSubmit");
  if (submit) submit.onclick = () => handleModalSubmit();
}

function handleModalSubmit() {
  const user = getUser();
  if (!user) return;
  const amount = parseFloat($("#modalAmount").value);
  const methodId = state.modal.methodId;
  if (!methodId) return setModalError("Veuillez choisir un moyen.");
  if (!amount || amount <= 0) return setModalError("Montant invalide.");
  const method = PAYMENT_METHODS.find(m => m.id === methodId);
  for (const f of method.fields) {
    const el = $(`#field-${f}`);
    if (!el || !el.value.trim()) return setModalError(`Le champ "${f}" est obligatoire.`);
  }
  if (state.modal.type === "withdraw" && amount > (user.balance || 0)) {
    return setModalError("Solde insuffisant pour ce retrait.");
  }

  const tx = {
    type: state.modal.type,
    method: method.id,
    methodLabel: method.name,
    amount: state.modal.type === "deposit" ? amount : -amount,
    status: "success",
    date: Date.now()
  };
  user.transactions = user.transactions || [];
  user.transactions.push(tx);

  if (state.modal.type === "deposit") user.balance = (user.balance||0) + amount;
  else user.balance = (user.balance||0) - amount;

  addNotification(
    state.modal.type === "deposit" ? "💰 Dépôt confirmé" : "✅ Retrait initié",
    state.modal.type === "deposit"
      ? `${fcfa(amount)} ajoutés via ${method.name}.`
      : `${fcfa(amount)} en route vers ${method.name}.`
  );

  saveDB(DB);
  const isDeposit = state.modal.type === "deposit";
  state.modal = null;
  setMessage(
    isDeposit
      ? `Dépôt de ${fcfa(amount)} confirmé via ${method.name}.`
      : `Retrait de ${fcfa(amount)} initié vers ${method.name}.`,
    "success"
  );
}

function setModalError(msg) {
  const target = $(".modal");
  if (!target) return;
  const existing = target.querySelector(".modal-error");
  if (existing) existing.remove();
  const el = document.createElement("p");
  el.className = "msg error modal-error";
  el.style.marginTop = "1rem";
  el.textContent = msg;
  target.appendChild(el);
}

/* ============================================================
   🔔 NOTIFICATIONS
   ============================================================ */
function addNotification(title, body) {
  const list = getNotifications();
  list.push({ id: Date.now() + Math.random(), title, body, date: Date.now(), read: false });
  setNotifications(list);
  showBrowserNotification(title, body);
}
function markAllRead() {
  const list = getNotifications();
  list.forEach(n => n.read = true);
  setNotifications(list);
}

/* ============================================================
   ⚡ ÉVÉNEMENTS
   ============================================================ */
function attachEvents() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.nav; state.showNotifCenter = false; render(); };
  });

  document.querySelectorAll("[data-modal]").forEach(btn => {
    btn.onclick = () => { state.modal = { type: btn.dataset.modal, methodId: null }; render(); };
  });

  const notifBtn = $("#notifBtn");
  if (notifBtn) notifBtn.onclick = () => { state.showNotifCenter = true; markAllRead(); render(); };

  const backBtn = $("#backBtn");
  if (backBtn) backBtn.onclick = () => { state.showNotifCenter = false; render(); };

  const markAllReadBtn = $("#markAllReadBtn");
  if (markAllReadBtn) markAllReadBtn.onclick = () => { markAllRead(); render(); };

  const clearNotifsBtn = $("#clearNotifsBtn");
  if (clearNotifsBtn) clearNotifsBtn.onclick = () => { setNotifications([]); render(); };

  const logoutBtn = $("#logoutBtn");
  if (logoutBtn) logoutBtn.onclick = () => { DB.currentUser = null; saveDB(DB); render(); };

  const regBtn = $("#registerBtn");
  if (regBtn) regBtn.onclick = () => {
    const email = $("#regEmail").value.trim().toLowerCase();
    const password = $("#regPassword").value;
    if (!email || !password) return setMessage("Email et mot de passe obligatoires.", "error");
    if (password.length < 6) return setMessage("Mot de passe : 6 caractères minimum.", "error");
    if (DB.users.some(u => u.email === email)) return setMessage("Cet email est déjà utilisé.", "error");
    const role = DB.users.length === 0 ? "admin" : "collaborateur";
    DB.users.push({ email, password, role, balance: 0, holdings: [], transactions: [] });
    DB.currentUser = email;
    saveDB(DB);
    setMessage(role === "admin" ? "Vous êtes administrateur principal." : "Compte créé.", "success");
    requestNotificationPermission();
  };

  const loginBtn = $("#loginBtn");
  if (loginBtn) loginBtn.onclick = () => {
    const email = $("#loginEmail").value.trim().toLowerCase();
    const password = $("#loginPassword").value;
    const user = DB.users.find(u => u.email === email && u.password === password);
    if (!user) return setMessage("Identifiants invalides.", "error");
    DB.currentUser = email;
    saveDB(DB);
    requestNotificationPermission();
  };

  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => { state.filter = btn.dataset.filter; render(); };
  });

  document.querySelectorAll("[data-buy]").forEach(btn => {
    btn.onclick = () => {
      const user = getUser();
      const treeId = btn.dataset.buy;
      const tree = TREES.find(t => t.id === treeId);
      const qty = parseInt(document.querySelector(`#qty-${treeId}`).value, 10);
      if (!qty || qty <= 0) return setMessage("Quantité invalide.", "error");
      const total = qty * tree.price;
      if (total > (user.balance || 0)) return setMessage(`Trésorerie insuffisante : ${fcfa(total)} requis.`, "error");

      user.balance -= total;
      user.holdings.push({
        treeId, qty, amount: total,
        date: Date.now(),
        lastClaimAt: Date.now()
      });
      user.transactions = user.transactions || [];
      user.transactions.push({
        type: "purchase",
        method: "internal",
        methodLabel: `Achat ${tree.name}`,
        amount: -total,
        status: "success",
        date: Date.now()
      });
      saveDB(DB);
      addNotification("🌱 Nouvelle plantation",
        `${qty} × ${tree.name} — ${fcfa(total)}. Revenu initial : ${fcfa(tree.dailyIncome * qty)}/jour.`);
      setMessage(`${qty} ${tree.name}${qty>1?'s':''} planté${qty>1?'s':''} — ${fcfa(total)}.`, "success");
    };
  });

  const claimBtn = $("#claimBtn");
  if (claimBtn) claimBtn.onclick = () => {
    const user = getUser();
    const nowMs = Date.now();
    let totalToClaim = 0;
    for (const h of user.holdings) {
      const e = computeEarnings(h, nowMs);
      if (e.totalEarned > 0) {
        totalToClaim += e.totalEarned;
        h.lastClaimAt = nowMs;
      }
    }
    if (totalToClaim <= 0) return setMessage("Rien à récupérer pour l'instant.", "error");
    user.balance = (user.balance || 0) + totalToClaim;
    user.transactions = user.transactions || [];
    user.transactions.push({
      type: "claim",
      method: "internal",
      methodLabel: "Récupération de revenus",
      amount: totalToClaim,
      status: "success",
      date: Date.now()
    });
    saveDB(DB);
    addNotification("✅ Revenus récupérés", `${fcfa(totalToClaim)} ajoutés à votre trésorerie.`);
    setMessage(`${fcfa(totalToClaim)} récupérés.`, "success");
  };
}

/* ============================================================
   🚀 DÉMARRAGE
   ============================================================ */
document.getElementById("year").textContent = new Date().getFullYear();
render();
setInterval(() => { if (getUser()) render(); }, 60_000);
</script>
